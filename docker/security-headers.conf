# Mismas cabeceras que vercel.json. Diferencia: la CSP permite Supabase LOCAL
# (http/ws://127.0.0.1:54321 y localhost:54321) en lugar de *.supabase.co.
# Se incluye en cada location porque nginx no hereda add_header si la location define otros.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' http://127.0.0.1:54321 ws://127.0.0.1:54321 http://localhost:54321 ws://localhost:54321; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
